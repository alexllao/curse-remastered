<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CURSE Remastered · Prueba de recorridos</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>CURSE <span>REMASTERED</span></h1>
          <p id="scene-name">0 · TITLE — Bienvenida</p>
        </div>
        <div class="controls">
          <button id="welcome">Portada</button>
          <button id="play-intro" disabled>Reproducir presentación</button>
          <button id="visual-mode" disabled>F2 · Original</button>
          <button id="previous-scene" disabled>‹ Anterior</button>
          <button id="next-scene" disabled>F3 · Siguiente ›</button>
          <button id="restart" disabled>Reiniciar</button
          ><button id="fullscreen">Pantalla completa</button>
        </div>
      </header>
      <div class="catalog">
        <label for="scene-select">Pantalla</label>
        <select id="scene-select" disabled>
          <option>0 · TITLE — Bienvenida</option>
        </select>
      </div>
      <p id="asset-info"></p>
      <div id="viewport"><p id="loading">Cargando escenarios…</p></div>
      <div class="controls panorama-controls">
        <button id="boundaries" aria-pressed="false">Mostrar límites</button>
        <button id="pan-left" disabled>← Panorama</button
        ><button id="pan-right" disabled>Panorama →</button>
      </div>
      <footer>
        <p id="status" role="status" aria-live="polite">
          Haz clic en el suelo para probar el recorrido de Ben.
        </p>
        <p id="mode">Original</p>
      </footer>
      <p>
        F3 / Mayús+F3: pantallas · F2: paquete gráfico · Flechas: panoramas. Clic: caminar. Las
        acciones y salidas se señalan sin ejecutarlas.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
